openapi: 3.0.3
info:
  title: OKR360 API
  version: 1.0.0
  description: 'REST contract of OKR360 V1. The NestJS backend must conform to this document.


    The backend is the final place where permissions are checked. `x-roles` lists the roles that may call; the data scope by reporting relationship is
    described in the description of each operation. `x-use-case` and `x-business-rules` point to `docs/03-use-cases.md` and `docs/requirements/business-rules.md`.

    '
servers:
- url: /api/v1
  description: Same host as the Web App
- url: http://localhost:3000/api/v1
  description: Development machine
tags:
- name: Login
- name: Profile
- name: Organization
- name: Users
- name: Cycles
- name: OKR
- name: Check-in
- name: 360 Form Templates
- name: 360 Rounds
- name: Nominations
- name: 360 Forms
- name: 360 Results
- name: Final Results
- name: Dashboard
- name: Reports
- name: Notifications
- name: Audit Log
- name: Automation
- name: Blockers
- name: Weekly Digests
- name: 1-1 Drafts
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Login
      summary: Log in
      operationId: login
      description: A wrong email, a wrong password, or a locked account all return the same 401 response. More than 5 failures within 15 minutes
        return 429.
      security: []
      x-use-case: UC01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags:
      - Login
      summary: Log out
      operationId: logout
      description: V1 does not revoke tokens on the server. The client deletes the token, and the token expires on its own.
      x-use-case: UC02
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      responses:
        '204':
          description: Success, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags:
      - Profile
      summary: View my profile
      operationId: getProfile
      x-use-case: UC03
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - Profile
      summary: Edit my profile
      operationId: updateProfile
      x-use-case: UC03
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-business-rules:
      - BR-015
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/password:
    post:
      tags:
      - Profile
      summary: Change password
      operationId: changePassword
      description: A wrong old password returns 400.
      x-use-case: UC03
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Success, no content
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/final-results:
    get:
      tags:
      - Final Results
      summary: View my final result
      operationId: getMyFinalResult
      description: Data is available only after publication; before that, returns 404.
      x-use-case: UC22
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-business-rules:
      - BR-075
      parameters:
      - name: cycleId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /departments:
    get:
      tags:
      - Organization
      summary: List departments and teams
      operationId: listDepartments
      description: Readable by every role, for use as filters and selection lists.
      x-use-case: UC04
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      parameters:
      - name: isActive
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Organization
      summary: Add a department or team
      operationId: createDepartment
      x-use-case: UC04
      x-roles:
      - ADMIN
      - HR
      x-permission: orgManage
      x-business-rules:
      - BR-010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Conflict: The parent unit creates a cycle.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /departments/{departmentId}:
    patch:
      tags:
      - Organization
      summary: Edit a department or team
      operationId: updateDepartment
      x-use-case: UC04
      x-roles:
      - ADMIN
      - HR
      x-permission: orgManage
      x-business-rules:
      - BR-010
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict: The parent unit creates a cycle.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /departments/{departmentId}/deactivate:
    post:
      tags:
      - Organization
      summary: Deactivate a unit
      operationId: deactivateDepartment
      x-use-case: UC04
      x-roles:
      - ADMIN
      - HR
      x-permission: orgManage
      x-business-rules:
      - BR-011
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict: The unit still has active employees.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /users:
    get:
      tags:
      - Users
      summary: List users
      operationId: listUsers
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: query
        in: query
        schema:
          type: string
      - name: departmentId
        in: query
        schema:
          type: integer
          format: int64
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/UserRole'
      - name: isActive
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Users
      summary: Add a user
      operationId: createUser
      description: HR assigning the ADMIN role returns 403.
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      x-business-rules:
      - BR-004
      - BR-012
      - BR-013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Conflict: Duplicate email, or the manager creates a cycle.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /users/directory:
    get:
      tags:
      - Users
      summary: Search colleagues
      operationId: listUserDirectory
      description: Used for the colleague search box, owner picker, and filters. Does not return email or role.
      x-use-case: UC17
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: query
        in: query
        schema:
          type: string
      - name: departmentId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryEntryPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{userId}:
    get:
      tags:
      - Users
      summary: View a user
      operationId: getUser
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Users
      summary: Edit a user
      operationId: updateUser
      description: HR assigning the ADMIN role returns 403.
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      x-business-rules:
      - BR-004
      - BR-012
      - BR-013
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict: Duplicate email, or the manager creates a cycle.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /users/{userId}/status:
    patch:
      tags:
      - Users
      summary: Enable or disable an account
      operationId: updateUserStatus
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      x-business-rules:
      - BR-014
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cycles:
    get:
      tags:
      - Cycles
      summary: List cycles
      operationId: listCycles
      description: Readable by every role, for use in the cycle picker.
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CycleStatus'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cycle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Cycles
      summary: Create a cycle
      operationId: createCycle
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      x-permission: cycleManage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleCreate'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cycles/{cycleId}:
    patch:
      tags:
      - Cycles
      summary: Edit a cycle
      operationId: updateCycle
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      x-permission: cycleManage
      x-business-rules:
      - BR-055
      parameters:
      - name: cycleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleUpdate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict: The cycle is closed, or the weights are changed after being locked.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cycles/{cycleId}/activate:
    post:
      tags:
      - Cycles
      summary: Activate a cycle
      operationId: activateCycle
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      x-permission: cycleManage
      x-business-rules:
      - BR-020
      - BR-021
      parameters:
      - name: cycleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict: Another ACTIVE cycle already exists, or the status is invalid.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cycles/{cycleId}/close:
    post:
      tags:
      - Cycles
      summary: Close a cycle
      operationId: closeCycle
      description: Finalizes the end-of-cycle progress of every Objective.
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      x-permission: cycleManage
      x-business-rules:
      - BR-020
      - BR-023
      parameters:
      - name: cycleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict: Invalid status.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /objectives:
    get:
      tags:
      - OKR
      summary: List Objectives
      operationId: listObjectives
      description: Soft-deleted OKRs do not appear. The departmentId of a department includes the teams within it.
      x-use-case: UC07
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-permission: okrRead
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: cycleId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: ownerUserId
        in: query
        schema:
          type: integer
          format: int64
      - name: departmentId
        in: query
        schema:
          type: integer
          format: int64
      - name: level
        in: query
        schema:
          $ref: '#/components/schemas/OkrLevel'
      - name: confidence
        in: query
        schema:
          $ref: '#/components/schemas/ConfidenceLevel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveSummaryPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - OKR
      summary: Create an Objective
      operationId: createObjective
      description: Permissions depend on the OKR level and the reporting relationship. After saving, the OKR Review workflow runs in the background; the API does not wait for the AI.
      x-use-case: UC08
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-permission: okrWrite
      x-business-rules:
      - BR-022
      - BR-030
      - BR-031
      - BR-032
      - BR-033
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveCreate'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Conflict: The cycle is closed.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /objectives/tree:
    get:
      tags:
      - OKR
      summary: OKR tree
      operationId: getObjectiveTree
      x-use-case: UC07
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-permission: okrRead
      parameters:
      - name: cycleId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: ownerUserId
        in: query
        schema:
          type: integer
          format: int64
      - name: departmentId
        in: query
        schema:
          type: integer
          format: int64
      - name: level
        in: query
        schema:
          $ref: '#/components/schemas/OkrLevel'
      - name: confidence
        in: query
        schema:
          $ref: '#/components/schemas/ConfidenceLevel'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectiveTreeNode'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /objectives/{objectiveId}:
    get:
      tags:
      - OKR
      summary: Objective details
      operationId: getObjective
      x-use-case: UC07
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-permission: okrRead
      parameters:
      - name: objectiveId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - OKR
      summary: Edit an Objective
      operationId: updateObjective
      x-use-case: UC08
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-permission: okrWrite
      x-business-rules:
      - BR-022
      - BR-030
      parameters:
      - name: objectiveId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
