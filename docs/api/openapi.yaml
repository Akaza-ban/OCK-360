components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The token expires after 30 minutes. V1 has no refresh token.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: Invalid data
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    Unauthorized:
      description: Missing token, or an invalid or expired token; for login, incorrect credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: No permission for this role or data
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not found, or soft-deleted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: More than 5 failed logins within 15 minutes
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    UserRole:
      type: string
      enum:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
    CycleStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - CLOSED
    OkrLevel:
      type: string
      enum:
      - COMPANY
      - DEPARTMENT
      - TEAM
      - INDIVIDUAL
    OrgUnitType:
      type: string
      enum:
      - DEPARTMENT
      - TEAM
    KrType:
      type: string
      enum:
      - NUMBER
      - PERCENT
      - BOOLEAN
    ConfidenceLevel:
      type: string
      enum:
      - ON_TRACK
      - AT_RISK
      - OFF_TRACK
    CampaignStatus:
      type: string
      enum:
      - DRAFT
      - NOMINATION
      - COLLECTING
      - CLOSED
      - PUBLISHED
    ReviewerGroup:
      type: string
      enum:
      - SELF
      - MANAGER
      - PEER
      - DIRECT_REPORT
    ResultGroup:
      type: string
      description: The group shown in the results. PEER_AND_REPORT is the merged group used when below the anonymity threshold.
      enum:
      - MANAGER
      - PEER
      - DIRECT_REPORT
      - PEER_AND_REPORT
    AssignmentStatus:
      type: string
      enum:
      - NOT_STARTED
      - DRAFT
      - SUBMITTED
      - CANCELLED
    NominationStatus:
      type: string
      enum:
      - DRAFT
      - PENDING
      - APPROVED
    ResultGrade:
      type: string
      enum:
      - EXCELLENT
      - GOOD
      - MEETS
      - NEEDS_IMPROVEMENT
      - INSUFFICIENT_DATA
    NotificationType:
      type: string
      enum:
      - CHECKIN_REMINDER
      - CHECKIN_OFF_TRACK
      - CHECKIN_COMMENT
      - PLANNING_REMINDER
      - NOMINATION_REMINDER
      - NOMINATION_PENDING
      - REVIEW_REMINDER
      - RESULT_PUBLISHED
      - BLOCKER_ROUTED
      - BLOCKER_UPDATED
      - WEEKLY_DIGEST
      - CHECKIN_MISMATCH
      - AI_DRAFT_READY
      - ONE_ON_ONE_SENT
      - AUTOMATION_ALERT
    AuditAction:
      type: string
      enum:
      - CREATE
      - UPDATE
      - SOFT_DELETE
      - RESTORE
      - STATUS_CHANGE
      - CHECKIN
      - SUBMIT
      - PUBLISH
      - LOGIN
      - LOGIN_FAILED
      - EXPORT
    AutomationFlow:
      type: string
      enum:
      - BLOCKER_ROUTING
      - WEEKLY_DIGEST
      - ONE_ON_ONE_DRAFT
      - CHECKIN_MISMATCH
      - OKR_REVIEW
      - REVIEW_COMMENT_GUARD
    TriggerKind:
      type: string
      enum:
      - EVENT
      - SCHEDULE
      - ON_SUBMIT
    RunStatus:
      type: string
      enum:
      - PENDING
      - RUNNING
      - SUCCEEDED
      - FAILED
      - SKIPPED
    BlockerCategory:
      type: string
      enum:
      - DEPENDENCY
      - RESOURCE
      - TECHNICAL
      - PRIORITY_CHANGE
      - OTHER
    SeverityLevel:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
    RoutingStatus:
      type: string
      enum:
      - OPEN
      - ACKNOWLEDGED
      - REJECTED
    ReviewIssue:
      type: string
      enum:
      - NOT_MEASURABLE
      - OUTPUT_ONLY
      - DUPLICATE
      - NOT_ALIGNED
    DraftStatus:
      type: string
      enum:
      - PENDING_REVIEW
      - SENT
      - DISCARDED
    ReportType:
      type: string
      enum:
      - OKR_PROGRESS
      - CHECKIN_RATE
      - FINAL_RESULTS
    ExportFormat:
      type: string
      enum:
      - XLSX
      - PDF
    CommentWarningKind:
      type: string
      enum:
      - IDENTIFYING
      - OFFENSIVE
    PageMeta:
      type: object
      required:
      - page
      - pageSize
      - total
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    ProblemDetails:
      type: object
      description: Error per RFC 9457. traceId is a lookup code shown to the user.
      required:
      - type
      - title
      - status
      - errorCode
      - traceId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        errorCode:
          type: string
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        traceId:
          type: string
    ValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: object
            description: Errors by field name.
            additionalProperties:
              type: array
              items:
                type: string
    UserRef:
      type: object
      description: Minimal information about a person.
      required:
      - id
      - fullName
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        jobTitle:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
    UnitRef:
      type: object
      required:
      - id
      - name
      - unitType
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        unitType:
          $ref: '#/components/schemas/OrgUnitType'
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required:
      - accessToken
      - expiresAt
      - user
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/Profile'
    Profile:
      type: object
      description: 'Safe profile: no password or hash.'
      required:
      - id
      - email
      - fullName
      - role
      - department
      - managedUnitIds
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        jobTitle:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        department:
          $ref: '#/components/schemas/UnitRef'
        manager:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/UserRef'
          type: object
        managedUnitIds:
          type: array
          items:
            type: integer
            format: int64
    ProfileUpdate:
      type: object
      description: Only the fields users can edit themselves (BR-015). V1 stores the avatar as a URL; there is no file upload API yet.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 30
        avatarUrl:
          type: string
          format: uri
          nullable: true
    PasswordChange:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
    Department:
      type: object
      required:
      - id
      - name
      - unitType
      - parentId
      - memberCount
      - isActive
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        unitType:
          $ref: '#/components/schemas/OrgUnitType'
        parentId:
          type: integer
          format: int64
        head:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/UserRef'
          type: object
        memberCount:
          type: integer
        isActive:
          type: boolean
    DepartmentCreate:
      type: object
      required:
      - name
      - unitType
      - parentId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        unitType:
          $ref: '#/components/schemas/OrgUnitType'
        parentId:
          type: integer
          format: int64
        headUserId:
          type: integer
          format: int64
          nullable: true
    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        parentId:
          type: integer
          format: int64
          nullable: true
        headUserId:
          type: integer
          format: int64
          nullable: true
    User:
      type: object
      required:
      - id
      - email
      - fullName
      - role
      - department
      - isActive
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        jobTitle:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        department:
          $ref: '#/components/schemas/UnitRef'
        manager:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/UserRef'
          type: object
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    UserCreate:
      type: object
      required:
      - email
      - fullName
      - initialPassword
      - role
      - departmentId
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        initialPassword:
          type: string
          minLength: 8
        jobTitle:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        departmentId:
          type: integer
          format: int64
        managerId:
