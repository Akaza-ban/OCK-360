openapi: 3.0.3
info:
  title: OKR360 API
  version: 1.0.0
  description: 'Hợp đồng REST của OKR360 V1. Backend NestJS phải tuân theo tài liệu này.


    Backend là nơi kiểm tra quyền cuối cùng. `x-roles` là các vai trò được gọi; phạm vi dữ liệu theo quan hệ báo cáo được
    ghi trong mô tả từng thao tác. `x-use-case` và `x-business-rules` trỏ tới `docs/03-use-cases.md` và `docs/requirements/business-rules.md`.

    '
servers:
- url: /api/v1
  description: Cùng host với Web App
- url: http://localhost:3000/api/v1
  description: Máy phát triển
tags:
- name: Đăng nhập
- name: Hồ sơ
- name: Tổ chức
- name: Người dùng
- name: Chu kỳ
- name: OKR
- name: Check-in
- name: Mẫu phiếu 360
- name: Đợt 360
- name: Đề cử
- name: Phiếu 360
- name: Kết quả 360
- name: Kết quả cuối kỳ
- name: Dashboard
- name: Báo cáo
- name: Thông báo
- name: Nhật ký
- name: Tự động hóa
- name: Vướng mắc
- name: Bản tin tuần
- name: Bản nháp 1-1
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Đăng nhập
      summary: Đăng nhập
      operationId: login
      description: Sai email, sai mật khẩu hay tài khoản bị khóa đều trả cùng một phản hồi 401. Quá 5 lần sai trong 15 phút
        trả 429.
      security: []
      x-use-case: UC01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags:
      - Đăng nhập
      summary: Đăng xuất
      operationId: logout
      description: V1 không thu hồi token ở server. Client xóa token và token tự hết hạn.
      x-use-case: UC02
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      responses:
        '204':
          description: Thành công, không có nội dung
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags:
      - Hồ sơ
      summary: Xem hồ sơ của tôi
      operationId: getProfile
      x-use-case: UC03
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - Hồ sơ
      summary: Sửa hồ sơ của tôi
      operationId: updateProfile
      x-use-case: UC03
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-business-rules:
      - BR-015
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/password:
    post:
      tags:
      - Hồ sơ
      summary: Đổi mật khẩu
      operationId: changePassword
      description: Sai mật khẩu cũ trả 400.
      x-use-case: UC03
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Thành công, không có nội dung
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/final-results:
    get:
      tags:
      - Kết quả cuối kỳ
      summary: Xem kết quả cuối kỳ của tôi
      operationId: getMyFinalResult
      description: Chỉ có dữ liệu sau khi công bố; trước đó trả 404.
      x-use-case: UC22
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-business-rules:
      - BR-075
      parameters:
      - name: cycleId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /departments:
    get:
      tags:
      - Tổ chức
      summary: Danh sách phòng ban và team
      operationId: listDepartments
      description: Mọi vai trò đọc được để dùng làm bộ lọc và danh sách chọn.
      x-use-case: UC04
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      parameters:
      - name: isActive
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Tổ chức
      summary: Thêm phòng ban hoặc team
      operationId: createDepartment
      x-use-case: UC04
      x-roles:
      - ADMIN
      - HR
      x-permission: orgManage
      x-business-rules:
      - BR-010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Xung đột: Đơn vị cha tạo vòng lặp.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /departments/{departmentId}:
    patch:
      tags:
      - Tổ chức
      summary: Sửa phòng ban hoặc team
      operationId: updateDepartment
      x-use-case: UC04
      x-roles:
      - ADMIN
      - HR
      x-permission: orgManage
      x-business-rules:
      - BR-010
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Xung đột: Đơn vị cha tạo vòng lặp.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /departments/{departmentId}/deactivate:
    post:
      tags:
      - Tổ chức
      summary: Ngưng hoạt động đơn vị
      operationId: deactivateDepartment
      x-use-case: UC04
      x-roles:
      - ADMIN
      - HR
      x-permission: orgManage
      x-business-rules:
      - BR-011
      parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Xung đột: Đơn vị còn nhân viên đang hoạt động.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /users:
    get:
      tags:
      - Người dùng
      summary: Danh sách người dùng
      operationId: listUsers
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: query
        in: query
        schema:
          type: string
      - name: departmentId
        in: query
        schema:
          type: integer
          format: int64
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/UserRole'
      - name: isActive
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Người dùng
      summary: Thêm người dùng
      operationId: createUser
      description: HR gán vai trò ADMIN trả 403.
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      x-business-rules:
      - BR-004
      - BR-012
      - BR-013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Xung đột: Email trùng hoặc quản lý tạo vòng lặp.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /users/directory:
    get:
      tags:
      - Người dùng
      summary: Tìm đồng nghiệp
      operationId: listUserDirectory
      description: Dùng cho ô tìm đồng nghiệp, chọn người sở hữu và bộ lọc. Không trả email hay vai trò.
      x-use-case: UC17
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: query
        in: query
        schema:
          type: string
      - name: departmentId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryEntryPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{userId}:
    get:
      tags:
      - Người dùng
      summary: Xem một người dùng
      operationId: getUser
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Người dùng
      summary: Sửa người dùng
      operationId: updateUser
      description: HR gán vai trò ADMIN trả 403.
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      x-business-rules:
      - BR-004
      - BR-012
      - BR-013
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Xung đột: Email trùng hoặc quản lý tạo vòng lặp.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /users/{userId}/status:
    patch:
      tags:
      - Người dùng
      summary: Bật hoặc tắt tài khoản
      operationId: updateUserStatus
      x-use-case: UC05
      x-roles:
      - ADMIN
      - HR
      x-permission: userManage
      x-business-rules:
      - BR-014
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdate'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cycles:
    get:
      tags:
      - Chu kỳ
      summary: Danh sách chu kỳ
      operationId: listCycles
      description: Mọi vai trò đọc được để dùng cho bộ chọn chu kỳ.
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CycleStatus'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cycle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Chu kỳ
      summary: Tạo chu kỳ
      operationId: createCycle
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      x-permission: cycleManage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleCreate'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cycles/{cycleId}:
    patch:
      tags:
      - Chu kỳ
      summary: Sửa chu kỳ
      operationId: updateCycle
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      x-permission: cycleManage
      x-business-rules:
      - BR-055
      parameters:
      - name: cycleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleUpdate'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Xung đột: Chu kỳ đã đóng, hoặc đổi tỷ trọng sau khi đã khóa.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cycles/{cycleId}/activate:
    post:
      tags:
      - Chu kỳ
      summary: Kích hoạt chu kỳ
      operationId: activateCycle
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      x-permission: cycleManage
      x-business-rules:
      - BR-020
      - BR-021
      parameters:
      - name: cycleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Xung đột: Đã có chu kỳ ACTIVE khác, hoặc sai trạng thái.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /cycles/{cycleId}/close:
    post:
      tags:
      - Chu kỳ
      summary: Đóng chu kỳ
      operationId: closeCycle
      description: Chốt tiến độ cuối kỳ của mọi Objective.
      x-use-case: UC06
      x-roles:
      - ADMIN
      - HR
      x-permission: cycleManage
      x-business-rules:
      - BR-020
      - BR-023
      parameters:
      - name: cycleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Xung đột: Sai trạng thái.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /objectives:
    get:
      tags:
      - OKR
      summary: Danh sách Objective
      operationId: listObjectives
      description: OKR đã xóa mềm không xuất hiện. departmentId của phòng ban gồm cả các team bên trong.
      x-use-case: UC07
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-permission: okrRead
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: cycleId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: ownerUserId
        in: query
        schema:
          type: integer
          format: int64
      - name: departmentId
        in: query
        schema:
          type: integer
          format: int64
      - name: level
        in: query
        schema:
          $ref: '#/components/schemas/OkrLevel'
      - name: confidence
        in: query
        schema:
          $ref: '#/components/schemas/ConfidenceLevel'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveSummaryPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - OKR
      summary: Tạo Objective
      operationId: createObjective
      description: Quyền theo cấp OKR và quan hệ báo cáo. Sau khi lưu, luồng Rà soát OKR chạy nền; API không chờ AI.
      x-use-case: UC08
      x-roles:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
      x-permission: okrWrite
      x-business-rules:
      - BR-022
      - BR-030
      - BR-031
      - BR-032
      - BR-033
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveCreate'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
        '400':
