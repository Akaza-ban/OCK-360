components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token hết hạn sau 30 phút. V1 không có refresh token.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    Unauthorized:
      description: Thiếu token, token sai hoặc hết hạn; với đăng nhập là thông tin không đúng
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Không có quyền với vai trò hoặc dữ liệu này
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Không tìm thấy, hoặc đã bị xóa mềm
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Quá 5 lần đăng nhập sai trong 15 phút
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    UserRole:
      type: string
      enum:
      - ADMIN
      - HR
      - MANAGER
      - EMPLOYEE
    CycleStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - CLOSED
    OkrLevel:
      type: string
      enum:
      - COMPANY
      - DEPARTMENT
      - TEAM
      - INDIVIDUAL
    OrgUnitType:
      type: string
      enum:
      - DEPARTMENT
      - TEAM
    KrType:
      type: string
      enum:
      - NUMBER
      - PERCENT
      - BOOLEAN
    ConfidenceLevel:
      type: string
      enum:
      - ON_TRACK
      - AT_RISK
      - OFF_TRACK
    CampaignStatus:
      type: string
      enum:
      - DRAFT
      - NOMINATION
      - COLLECTING
      - CLOSED
