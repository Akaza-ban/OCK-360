    WeeklyDigest:
      allOf:
      - $ref: '#/components/schemas/WeeklyDigestSummary'
      - type: object
        required:
        - stats
        - highlights
        - aiGenerated
        - runId
        properties:
          stats:
            $ref: '#/components/schemas/DigestStats'
          highlights:
            type: array
            maxItems: 3
            items:
              $ref: '#/components/schemas/DigestHighlight'
          aiGenerated:
            type: boolean
          runId:
            type: integer
            format: int64
    OneOnOneDraftSummary:
      type: object
      required:
      - id
      - campaignId
      - reviewee
      - status
      - createdAt
      properties:
        id:
          type: integer
          format: int64
        campaignId:
          type: integer
          format: int64
        reviewee:
          $ref: '#/components/schemas/UserRef'
        status:
          $ref: '#/components/schemas/DraftStatus'
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
    OneOnOneDraft:
      allOf:
      - $ref: '#/components/schemas/OneOnOneDraftSummary'
      - type: object
        required:
        - aiStrengths
        - aiImprovements
        - aiGenerated
        - runId
        properties:
          aiStrengths:
            type: array
            items:
              type: string
          aiImprovements:
            type: array
            items:
              type: string
          editedText:
            type: string
            nullable: true
          aiGenerated:
            type: boolean
          runId:
            type: integer
            format: int64
          campaignPublished:
            type: boolean
    OneOnOneDraftUpdate:
      type: object
      required:
      - editedText
      properties:
        editedText:
          type: string
          minLength: 1
    AutomationRunPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/AutomationRun'
    RoutedBlockerPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/RoutedBlocker'
